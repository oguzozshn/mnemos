[project]
name = "mnemos"
version = "0.1.0"
description = "Local-first personal memory engine built from AI chat exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
mnemos = "mnemos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
